Älä uudista koko diagnostiikkamoottoria.

Säilytä nykyinen CLI-toiminnallisuus.
Säilytä yhteinen Command Runner.
Säilytä rakenteiset tietomallit.
Säilytä käyttöliittymäriippumattomuus.

Varmista, että virheelliset syötteet hylätään
ennen järjestelmäkomentojen suorittamista.

Käytä yksinkertaista Pythonia.

Raportoi tehdyt muutokset ja testitulokset.

Älä tee committeja tai pushaa muutoksia.
